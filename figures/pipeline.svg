<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive alpha scanner pipeline</title>
  <desc id="desc">A six-stage pipeline from dataset history and SPRT gates through field-first sampling, higher-order construction, false-discovery estimation, and candidate checks.</desc>
  <rect width="1100" height="250" fill="#f7f8fb" rx="18"/>
  <style>
    .box{fill:#fff;stroke:#243b53;stroke-width:2}.accent{fill:#e8f1ff;stroke:#2563eb;stroke-width:2}.t{font:600 16px system-ui,sans-serif;fill:#102a43}.s{font:13px system-ui,sans-serif;fill:#486581}.arrow{stroke:#829ab1;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#829ab1"/></marker></defs>
  <path class="arrow" fill="none" stroke="#829ab1" stroke-width="2.5" d="M175 125H205M355 125H385M535 125H565M715 125H745M895 125H925"/>
  <g transform="translate(25 75)"><rect fill="#ffffff" stroke="#243b53" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">History gate</text><text class="s" x="75" y="59" text-anchor="middle">minimum usable</text><text class="s" x="75" y="78" text-anchor="middle">observations</text></g>
  <g transform="translate(205 75)"><rect fill="#e8f1ff" stroke="#2563eb" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">Wald SPRT</text><text class="s" x="75" y="59" text-anchor="middle">sample 80 fields</text><text class="s" x="75" y="78" text-anchor="middle">mine or abandon</text></g>
  <g transform="translate(385 75)"><rect fill="#e8f1ff" stroke="#2563eb" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">Field-first</text><text class="s" x="75" y="59" text-anchor="middle">prioritize fields</text><text class="s" x="75" y="78" text-anchor="middle">after first hit</text></g>
  <g transform="translate(565 75)"><rect fill="#ffffff" stroke="#243b53" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">Higher orders</text><text class="s" x="75" y="59" text-anchor="middle">bounded parent</text><text class="s" x="75" y="78" text-anchor="middle">expansion</text></g>
  <g transform="translate(745 75)"><rect fill="#ffffff" stroke="#243b53" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">Luck estimate</text><text class="s" x="75" y="59" text-anchor="middle">expected noise hits</text><text class="s" x="75" y="78" text-anchor="middle">over observed hits</text></g>
  <g transform="translate(925 75)"><rect fill="#ffffff" stroke="#243b53" stroke-width="2" width="150" height="100" rx="12"/><text class="t" x="75" y="34" text-anchor="middle">Candidate checks</text><text class="s" x="75" y="59" text-anchor="middle">strength, breadth,</text><text class="s" x="75" y="78" text-anchor="middle">novelty</text></g>
</svg>

